<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding AI — An Online Book</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-book">
                <div class="loading-page"></div>
                <div class="loading-page"></div>
                <div class="loading-page"></div>
            </div>
            <p class="loading-text">Opening your book...</p>
        </div>
    </div>

    <!-- Top Bar -->
    <header id="top-bar">
        <div class="top-bar-left">
            <button id="toc-toggle" class="icon-btn" aria-label="Table of Contents" title="Table of Contents">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <h1 class="book-title">Understanding AI</h1>
        </div>
        <div class="top-bar-right">
            <button id="font-decrease" class="icon-btn" aria-label="Decrease font size" title="Decrease font size">A−</button>
            <button id="font-increase" class="icon-btn" aria-label="Increase font size" title="Increase font size">A+</button>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg id="theme-icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg id="theme-icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button id="fullscreen-toggle" class="icon-btn" aria-label="Toggle fullscreen" title="Toggle fullscreen">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Table of Contents Sidebar -->
    <aside id="toc-sidebar" class="toc-closed">
        <div class="toc-header">
            <h2>Contents</h2>
            <button id="toc-close" class="icon-btn" aria-label="Close table of contents">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <nav id="toc-list"></nav>
    </aside>
    <div id="toc-overlay" class="toc-overlay-hidden"></div>

    <!-- Book Container -->
    <main id="book-container">
        <div id="book">
            <!-- Left page (previous content / decoration) -->
            <div class="book-page book-page-left" id="page-left">
                <div class="page-texture"></div>
                <div class="page-content" id="page-left-content"></div>
                <div class="page-number" id="page-left-number"></div>
            </div>
            <!-- Right page (current reading) -->
            <div class="book-page book-page-right" id="page-right">
                <div class="page-texture"></div>
                <div class="page-content" id="page-right-content"></div>
                <div class="page-number" id="page-right-number"></div>
            </div>
            <!-- Book spine -->
            <div class="book-spine"></div>
            <!-- Page flip overlay (for animation) -->
            <div id="page-flip" class="page-flip">
                <div class="page-flip-front"></div>
                <div class="page-flip-back"></div>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <nav id="book-nav">
        <button id="prev-btn" class="nav-btn" aria-label="Previous page">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            <span>Previous</span>
        </button>
        <div id="progress-container">
            <div id="progress-bar"></div>
            <span id="progress-text">Chapter 1 of 5</span>
        </div>
        <button id="next-btn" class="nav-btn" aria-label="Next page">
            <span>Next</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 6 15 12 9 18"/>
            </svg>
        </button>
    </nav>

    <!-- Bookmark toast -->
    <div id="bookmark-toast" class="toast hidden">Bookmark saved!</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
